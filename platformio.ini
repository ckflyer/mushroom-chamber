; Mushroom Fruiting Chamber Controller
; Build:  pio run
; Flash:  pio run -t upload
; Serial: pio device monitor
;
; After the first flash the board makes a WiFi network called
; "Chamber-Setup". Join it, pick your WiFi, done. No credentials in code,
; so this repo is safe to share.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DASYNCWEBSERVER_REGEX
    -std=gnu++17

; The Arduino core still defaults to gnu++11, which makes every inline
; variable in this project a warning. Swap it out.
build_unflags =
    -std=gnu++11

; Adafruit's BusIO layer pulls in SPI.h even when only I2C is used, and the
; dependency finder does not always spot it. Declaring both buses explicitly
; keeps the build identical everywhere.
lib_ldf_mode = deep+

lib_deps =
    SPI
    Wire
    ESP32Async/AsyncTCP @ ^3.3.2
    ESP32Async/ESPAsyncWebServer @ ^3.7.0
    adafruit/Adafruit SHT31 Library @ ^2.2.2
    bblanchon/ArduinoJson @ ^7.2.0
    knolleary/PubSubClient @ ^2.8
    https://github.com/tzapu/WiFiManager.git#v2.0.17
